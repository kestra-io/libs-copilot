name: Auto Release
# when a semver commit worthy of being release reach the main branch, increment semver version and release it automatically
on:
  push:
    branches:
      - main
    tags-ignore:
      - '*'
permissions:
  contents: write
  actions: read
  pull-requests: write
  packages: read


jobs:
  tag:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PERSONAL_TOKEN }}
      - name: Git - Configure
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: setup Java
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: 'true'
          java-version: '25'

      - name: Auth to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}'

      - name: Build with Gradle
        run: |
          ./gradlew check

      - name: Auto release
        run: |
          VERSION=$(./gradlew -q calculateNextSemverVersion)
          echo "version to release: $VERSION"
          ./gradlew releaseVersion -PversionToRelease=$VERSION